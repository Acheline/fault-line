# Design labels for the post-2024 non-fiat USD stablecoin universe (risk/base_rates.py yield_synthetic_universe).
# Used to split base rates by design. Each label carries its source:
#   llama:<protocol> (<category>)  DefiLlama protocol category of the exact issuer
#   coingecko:<category>           CoinGecko category on the coin itself
#   manual                         Fault Line label from the issuer's published design (both sources missing/wrong);
#                                  to verify, listed in the Assumptions page
# Coins whose design could not be supported by a source are "unclassified" and left out of the class rates.
# Designs: yield_delta_neutral (basis-trading / strategy- or deployment-backed synthetic dollars), cdp
# (over-collateralised debt positions), algorithmic, nav_rwa (NAV-accruing RWA / credit / reinsurance).

